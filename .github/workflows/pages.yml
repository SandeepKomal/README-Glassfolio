name: Deploy README-Glassfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Browsers keep the site's files for a while; a new address per deploy makes every visitor load the new scripts,
      # and version.txt lets a page that was itself kept from an older deploy notice it and reload once
      - name: Stamp asset versions
        run: |
          set -euo pipefail
          build="${GITHUB_SHA::12}"
          sed -i "s/?v=dev\"/?v=${build}\"/g; s/<meta name=\"build\" content=\"dev\">/<meta name=\"build\" content=\"${build}\">/" index.html
          grep -q "<meta name=\"build\" content=\"${build}\">" index.html
          printf '%s\n' "$build" > version.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
