name: Deploy README-Glassfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # nothing reaches the live site unless the whole test suite passes on this exact commit
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run the test suite
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # only the deploy job may publish to Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # Browsers keep the site's files for a while; a new address per deploy makes every visitor load the new scripts,
      # and version.txt lets a page that was itself kept from an older deploy notice it and reload once
      - name: Stamp asset versions
        run: |
          set -euo pipefail
          build="${GITHUB_SHA::12}"
          sed -i "s/?v=dev\"/?v=${build}\"/g; s/<meta name=\"build\" content=\"dev\">/<meta name=\"build\" content=\"${build}\">/" index.html
          # the pages people read live in their own folders (the .html files beside index.html only redirect to them)
          pages="index.html privacy/index.html terms/index.html how-to-use/index.html license/index.html"
          sed -i "s/?v=dev\"/?v=${build}\"/g" privacy/index.html terms/index.html how-to-use/index.html license/index.html
          # the footer's version pill names the commit each page was built from, linked to it on GitHub
          sed -i "s|/commits/main\" title=\"The commit this page was built from\">dev<|/commit/${GITHUB_SHA}\" title=\"The commit this page was built from\">${GITHUB_SHA::7}<|" $pages
          grep -q "<meta name=\"build\" content=\"${build}\">" index.html
          for f in $pages; do grep -q ">${GITHUB_SHA::7}</a>" "$f"; done
          printf '%s\n' "$build" > version.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
