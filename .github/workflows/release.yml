name: Release
# Pushing a version tag (v1.0.0, v1.1.0, ...) runs the test suite and then publishes a GitHub release for that tag,
# with notes generated from the pull requests merged since the previous release. Nothing else in the repository changes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # nothing to cache (no dependencies), and a release must not restore a cache another run could have written
          package-manager-cache: false
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - name: Run the test suite
        run: npm test

  release:
    name: Publish the release
    needs: test
    runs-on: ubuntu-latest
    # the only job that can write: it creates the release and nothing else
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes --title "README Glassfolio $TAG"
