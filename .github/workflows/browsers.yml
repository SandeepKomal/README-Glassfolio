name: Browsers
# Opens every page in Chromium, Firefox and WebKit (Safari's engine) on desktop, tablet and phone profiles, and fails
# on script errors, security-policy violations, requests to other sites, sideways scrolling or a wrapping header.
# Playwright comes from tools/package-lock.json (exact versions and integrity hashes); the project itself has no dependencies.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    name: Browsers (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    # Playwright's own image already has every engine's system libraries, so nothing is installed with apt: twice the
    # WebKit job ran out of time inside "playwright install --with-deps" on a slow Ubuntu mirror. Pinned by digest;
    # keep the tag on the Playwright version in tools/package-lock.json (a mismatch still works, it just downloads
    # that version's browsers, but the libraries may lag).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      # the image's non-root user, which owns the checkout; Firefox refuses to run as root under another user's home
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Playwright
        env:
          ENGINE: ${{ matrix.engine }}
        # the image's Node runs the check; the browser is already in the image, so this only downloads one if the
        # lockfile's Playwright is newer than the image
        run: |
          npm ci --prefix tools --ignore-scripts
          npx --prefix tools --no-install playwright install "$ENGINE"
      - name: Check every page
        env:
          ENGINE: ${{ matrix.engine }}
        run: node tools/browser-check.js "$ENGINE"
