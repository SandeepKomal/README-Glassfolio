# Dependabot version updates.
# The project has no npm dependencies; the only versioned dependencies are the
# GitHub Actions used by the workflows in .github/workflows/.
# Options: see "Configuration options for the dependabot.yml file" in GitHub's documentation.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # wait a week after a release before proposing it, so a bad or compromised version is usually caught first
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # Playwright for the optional developer tools and the browser checks in CI (tools/package-lock.json)
  - package-ecosystem: "npm"
    directory: "/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
