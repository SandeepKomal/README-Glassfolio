# Dependabot version updates.
# The project has no npm dependencies; the only versioned dependencies are the
# GitHub Actions used by the workflows in .github/workflows/.
# Options: see "Configuration options for the dependabot.yml file" in GitHub's documentation.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
